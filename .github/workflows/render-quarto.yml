# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    paths: ['**.qmd', '**/*methods*.md', 'scripts/**', 'tests/**',
            '**/.renvignore', 'renv.lock', 'renv/settings.json',
            '.github/workflows/render-quarto.yml']
  workflow_dispatch:

name: Render quarto

permissions: read-all

jobs:
  render-quatro:
    runs-on: ubuntu-latest    
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libfontconfig1-dev \
            libfreetype6-dev libharfbuzz-dev libfribidi-dev libpng-dev \
            libtiff-dev libjpeg-dev libwebp-dev
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'renv' 
      - uses: r-lib/actions/setup-renv@v2
        with:
          bypass-cache: 'never'

      - name: Check R dependencies and report filters
        run: |
          Rscript -e 'status <- renv::status(); if (!status$synchronized) stop("R dependencies are out of sync with renv.lock.")'
          Rscript tests/report_filters.R
      
      - name: Render Quarto Project
        id: render
        shell: bash
        run: |
          failed=0
          echo '## Report rendering' >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r -d '' file; do
            if [[ "$file" == 'tomato_experience/tomatoes_experience.qmd' && ! -f tomato_experience/tomatoes.csv ]]; then
              printf -- '- Archived: `%s` (requires the unavailable historical `tomatoes.csv`; existing output retained).\n' "$file" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            echo "Rendering $file"
            if quarto render "$file" --to html; then
              printf -- '- Passed: `%s`\n' "$file" >> "$GITHUB_STEP_SUMMARY"
            else
              printf -- '- Failed: `%s`\n' "$file" >> "$GITHUB_STEP_SUMMARY"
              echo "::error file=$file::Report rendering failed; continuing with other reports."
              failed=$((failed + 1))
            fi
          done < <(git ls-files -z -- '*.qmd')
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
        # uses: quarto-dev/quarto-actions/render@v2
        # with:
        #   to: html # If set, it will be equivalent to `quarto render --to html`
        #   path: . # By default, the current working dir is used i.e `quarto render .`
        env: 
          GITHUB_TOKEN: ${{ secrets.github_token }}
          JATOS_TOKEN: ${{ secrets.JATOS_TOKEN }}
          JATOS_DECOY_STUDY_UID: ${{ secrets.JATOS_DECOY_STUDY_UID }}
          JATOS_DECOY_STUDY_2026_UID: ${{ secrets.JATOS_DECOY_STUDY_2026_UID }}
          JATOS_DECOY_STUDY_2026H_UID: ${{ secrets.JATOS_DECOY_STUDY_2026H_UID }}
          JATOS_COLORS_AND_IMAGERY_STUDY_UID: ${{ secrets.JATOS_COLORS_AND_IMAGERY_STUDY_UID }}
          JATOS_COLORS_AND_IMAGERY_STUDY_2026_UID: ${{ secrets.JATOS_COLORS_AND_IMAGERY_STUDY_2026_UID }}
          JATOS_COLORS_AND_IMAGERY_STUDY_2026H_UID: ${{ secrets.JATOS_COLORS_AND_IMAGERY_STUDY_2026H_UID }}
          JATOS_OBJ_STUDY_UID: ${{ secrets.JATOS_OBJ_STUDY_UID }}
          JATOS_TOMATO_STUDY_UID: ${{ secrets.JATOS_TOMATO_STUDY_UID }}
          JATOS_TOMATO_STUDY_2026_UID: ${{ secrets.JATOS_TOMATO_STUDY_2026_UID }}            
          JATOS_TEMP_ATT_STUDY_UID: ${{ secrets.JATOS_TEMP_ATT_STUDY_UID }}
          JATOS_MONSTERS_STUDY_UID: ${{ secrets.JATOS_MONSTERS_STUDY_UID }}
          JATOS_START_DATE: ${{ vars.JATOS_START_DATE }}
          
      - name: Commit and Push Changes
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
      
          # Add all necessary files
          git add *
      
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m 'Rendered markdown files'
            git push origin
          fi

      - name: Report rendering failures
        if: steps.render.outputs.failed != '0'
        run: |
          echo "${{ steps.render.outputs.failed }} report(s) failed. See the report rendering summary."
          exit 1

